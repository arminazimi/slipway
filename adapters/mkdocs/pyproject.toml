[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slipway-mkdocs"
version = "0.0.0"
dependencies = ["mkdocs>=1.5", "beautifulsoup4>=4.12.0"]

[project.entry-points."mkdocs.plugins"]
slipway = "slipway_mkdocs:SlipwayPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/slipway_mkdocs.py"]
