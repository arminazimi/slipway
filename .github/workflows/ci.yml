name: ci

# Mizzen and Lateen are TypeScript on Node's built-in type stripping, so CI needs Node and nothing else:
# no Ruby, no browser, and no Seaworthy checkout. `npm run check` runs the roadmap check, every test, the type check of
# each workspace, and the fixed checks; steps that need a missing optional tool print SKIP when they are missing.
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests a batch of pull requests on a temporary
  # gh-readonly-queue/main/... branch. Without this trigger its checks never
  # start, and every queued pull request waits forever.
  merge_group:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  # The one check branch protection and the merge queue require. It runs even when a job it
  # needs failed or was cancelled, and fails unless every one of them succeeded.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != success ]; then
              echo "a job ci-ok needs finished as: $r"
              exit 1
            fi
          done
          echo "all jobs succeeded"
