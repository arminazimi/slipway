name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.jekyll }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # pages: the github-pages gem (Jekyll 3.10). jekyll4: plain Jekyll 4, as on Netlify or Cloudflare Pages.
        jekyll: [pages, jekyll4]
    env:
      BUNDLE_GEMFILE: ${{ matrix.jekyll == 'jekyll4' && 'tools/theme/gemfiles/jekyll4.gemfile' || 'Gemfile' }}
      # Ruby and the Pages gem are part of this job, so a skipped site build is a failure.
      SLIPWAY_REQUIRE_BUILD: "1"
      SLIPWAY_REQUIRE_SEAWORTHY: "1"
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The GitHub Pages environment: the Ruby in .ruby-version and the github-pages gem
      # (Jekyll and the whitelisted plugins), installed from Gemfile.lock.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: actions/cache@v4
        with:
          path: .seaworthy
          key: seaworthy-${{ hashFiles('tools/seaworthy/pin.json') }}
      # Docusaurus, for the Docusaurus adapter's tests (adapters/docusaurus), which skip without it.
      - name: Install Docusaurus
        run: |
          npm install --prefix "$RUNNER_TEMP/docusaurus" --no-save --no-audit --no-fund @docusaurus/core@3.10.2 @docusaurus/preset-classic@3.10.2 react@19.2.0 react-dom@19.2.0
          echo "DOCUSAURUS_MODULES=$RUNNER_TEMP/docusaurus/node_modules" >> "$GITHUB_ENV"
      # Eleventy, for the Eleventy adapter's tests (adapters/eleventy), which skip without it.
      - name: Install Eleventy
        run: |
          npm install --prefix "$RUNNER_TEMP/eleventy" --no-save --no-audit --no-fund @11ty/eleventy@3.0.0 markdown-it@14.1.0 markdown-it-anchor@9.2.0
          echo "ELEVENTY_MODULES=$RUNNER_TEMP/eleventy/node_modules" >> "$GITHUB_ENV"
      # Hugo, for the Hugo adapter's tests (adapters/hugo), which skip without it.
      - name: Install Hugo
        run: |
          curl -fsSL https://github.com/gohugoio/hugo/releases/download/v0.152.2/hugo_0.152.2_linux-amd64.tar.gz | tar -xz -C "$RUNNER_TEMP" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: npm ci
      - if: matrix.jekyll == 'pages'
        run: bundle exec github-pages versions
      - if: matrix.jekyll == 'pages'
        run: npm run check
      - if: matrix.jekyll == 'pages'
        name: Upgrade test
        run: node tools/release/upgrade-test.mjs
      # The Jekyll 4 job builds and verifies every example, then compares the minimal one with the
      # Pages build, so it installs the Pages gem too.
      - if: matrix.jekyll == 'jekyll4'
        run: bundle exec jekyll --version && npm run check:site
      - if: matrix.jekyll == 'jekyll4'
        run: BUNDLE_GEMFILE=Gemfile bundle install --jobs 4
      - if: matrix.jekyll == 'jekyll4'
        run: node --test tools/theme/jekyll4.test.mjs
        env:
          SLIPWAY_REQUIRE_JEKYLL4: "1"
      # The doctor Action (action/doctor) on a site that must reach L3, and as a report on examples/docs,
      # which does not reach L0 yet.
      - if: matrix.jekyll == 'pages'
        uses: ./action/doctor
        with:
          path: packages/doctor/test/fixtures/conforming
          build: packages/doctor/test/fixtures/conforming/build
          level: L3
          sarif: "true"
          setup-node: "false"
      - if: matrix.jekyll == 'pages'
        uses: ./action/doctor
        with:
          path: examples/docs
          level: none
          setup-node: "false"

  browser:
    name: browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: node tools/browser/run.mjs
