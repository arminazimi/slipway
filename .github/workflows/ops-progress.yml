name: ops-progress

# When a task closes, keep its epic's "7 of 12 done" line current.
#
# The line sits between `<!-- progress -->` markers. The roadmap sync regenerates epic
# bodies from ROADMAP.md, so the line goes in an issue comment that is edited in place:
# a comment survives the sync, and the tool never creates a second one.
on:
  issues:
    types: [closed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ops-progress
  cancel-in-progress: false

jobs:
  progress:
    name: update epic progress
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Reads every issue (open and closed) and writes only the progress comment or body.
      - name: Update the progress line
        run: node tools/ops/progress.mjs --apply
        env:
          GH_TOKEN: ${{ github.token }}
