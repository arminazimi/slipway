name: flaky

# Runs every *.test.mjs three times and keeps one issue labeled `flaky` up to date with the tests
# that passed in one run and failed in another. The logic lives in tools/flaky/flaky.mjs.
on:
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: flaky
  cancel-in-progress: false

jobs:
  flaky:
    name: flaky tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Run the tests three times and update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node tools/flaky/flaky.mjs
