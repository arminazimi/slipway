name: pages-live

# Checks the deployed site at https://arminazimi.github.io/slipway/, not only its build (issue #702):
# mirrors what users get, fails on a same-site link or file that does not answer, and runs Seaworthy
# on the mirror. One `site-down` issue stays open while a run fails; a passing run closes it.
on:
  schedule:
    # Nightly at 03:17 UTC, off-peak (GitHub may start scheduled runs late under load).
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-live
  cancel-in-progress: false

env:
  SITE_URL: https://arminazimi.github.io/slipway/
  MIRROR_DIR: .tmp/live
  REPORT_DIR: .tmp/live-check

jobs:
  live:
    name: deployed site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Seaworthy is not on npm yet: `npm run seaworthy:setup` fetches the commit in
      # tools/seaworthy/pin.json and builds its CLI into .seaworthy (the same cache ci.yml uses).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .seaworthy
          key: seaworthy-${{ hashFiles('tools/seaworthy/pin.json') }}
      - name: Fetch Seaworthy at the pinned commit
        run: echo "SEAWORTHY_CLI=$(npm run --silent seaworthy:setup)" >> "$GITHUB_ENV"
      - name: Mirror the deployed site and check its links
        id: mirror
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          // Mirrors the deployed site under MIRROR_DIR, keeping its /slipway/ prefix so that a
          // root-absolute link resolves the way it does in production, and fails on any same-site
          // link or file that does not answer. Other hosts are Seaworthy's `links.external` job.
          import { appendFileSync, mkdirSync, writeFileSync } from "node:fs";
          import { dirname, join, resolve } from "node:path";

          const base = new URL(process.env.SITE_URL);
          const out = resolve(process.env.MIRROR_DIR);
          const reports = resolve(process.env.REPORT_DIR);
          const prefix = base.pathname.endsWith("/") ? base.pathname : `${base.pathname}/`;
          const LIMIT = 500;
          const CONCURRENCY = 6;
          // Site-wide files that nothing links to, but Seaworthy reads. They are optional: a 404
          // means the site does not publish one. Seaworthy reads them from the mirror root, so
          // they are also copied there; the mirror itself keeps the /slipway/ prefix.
          const ROOT_FILES = new Set(["llms.txt", "llms-full.txt", "robots.txt", "sitemap.xml"]);

          const seeds = [...ROOT_FILES].map((name) => new URL(name, base).href);
          const queue = [base.href, ...seeds];
          const queued = new Set(queue);
          const optional = new Set(seeds);
          const broken = [];
          let fetched = 0;
          let optionalSkipped = 0;
          let cursor = 0;

          /** The http(s) URL a link points at, without its fragment; null for mail, scripts, and other schemes. */
          function link(raw, from) {
            const value = String(raw).trim();
            if (value === "" || value.startsWith("#") || /^(mailto:|tel:|javascript:|data:|blob:)/i.test(value)) return null;
            let url;
            try {
              url = new URL(value, from);
            } catch {
              return null;
            }
            if (url.protocol !== "http:" && url.protocol !== "https:") return null;
            url.hash = "";
            return url;
          }

          function enqueue(raw, from) {
            const url = link(raw, from);
            if (!url || url.origin !== base.origin || queued.has(url.href) || queued.size >= LIMIT) return;
            queued.add(url.href);
            queue.push(url.href);
          }

          async function fetchOne(url) {
            let response;
            try {
              response = await fetch(url, { redirect: "follow", headers: { "user-agent": "slipway-pages-live (+https://github.com/arminazimi/slipway)" } });
            } catch (error) {
              broken.push(`${url} (${error.cause?.message ?? error.message})`);
              return;
            }
            if (!response.ok) {
              if (optional.has(url) && (response.status === 404 || response.status === 410)) {
                optionalSkipped++;
                return;
              }
              broken.push(`${url} (HTTP ${response.status})`);
              return;
            }
            const final = new URL(response.url);
            const type = response.headers.get("content-type") ?? "";
            const bytes = Buffer.from(await response.arrayBuffer());
            // A same-origin link outside the deployed path (a wrong base URL) is checked, not mirrored.
            if (final.origin !== base.origin || !final.pathname.startsWith(prefix)) return;
            const path = decodeURIComponent(final.pathname);
            const suffix = path.endsWith("/") ? "index.html" : type.includes("text/html") && !path.endsWith(".html") ? "/index.html" : "";
            const file = resolve(out, `.${path}${suffix}`);
            if (!file.startsWith(`${out}/`)) return;
            mkdirSync(dirname(file), { recursive: true });
            writeFileSync(file, bytes);
            if (ROOT_FILES.has(path.slice(prefix.length))) writeFileSync(resolve(out, path.slice(prefix.length)), bytes);
            fetched++;
            if (!type.includes("text/html")) {
              // llms.txt links pages as Markdown; they are part of the site too.
              if (path.endsWith(".txt")) for (const match of bytes.toString("utf8").matchAll(/\]\(([^)\s]+)\)/g)) enqueue(match[1], final);
              return;
            }
            const html = bytes.toString("utf8");
            for (const match of html.matchAll(/\s(?:href|src)\s*=\s*["']([^"']+)["']/gi)) enqueue(match[1], final);
            for (const match of html.matchAll(/\ssrcset\s*=\s*["']([^"']+)["']/gi)) for (const part of match[1].split(",")) enqueue(part.trim().split(/\s+/)[0], final);
          }

          await new Promise((done) => {
            let active = 0;
            const tick = () => {
              if (active === 0 && cursor >= queue.length) return done();
              while (active < CONCURRENCY && cursor < queue.length) {
                const url = queue[cursor++];
                active++;
                fetchOne(url)
                  .catch((error) => broken.push(`${url} (${error.message})`))
                  .finally(() => {
                    active--;
                    tick();
                  });
              }
            };
            tick();
          });

          broken.sort();
          const checked = queued.size - optionalSkipped;
          const limit = queued.size >= LIMIT ? ` (stopped at the ${LIMIT}-URL limit)` : "";
          const summary =
            broken.length === 0
              ? `The link check of ${base.href} passed: all ${checked} same-site URLs answered${limit}.`
              : `The link check of ${base.href} failed: ${broken.length} of ${checked} same-site URLs did not answer${limit}.\n\n${broken.map((entry) => `- ${entry}`).join("\n")}`;
          mkdirSync(reports, { recursive: true });
          writeFileSync(join(reports, "links.md"), `${summary}\n`);
          console.log(summary);
          if (process.env.GITHUB_OUTPUT) appendFileSync(process.env.GITHUB_OUTPUT, `fetched=${fetched}\nbroken=${broken.length}\n`);
          process.exitCode = broken.length === 0 ? 0 : 1;
          NODE
      - name: Run Seaworthy on the mirror
        id: seaworthy
        # Seaworthy verifies a folder, so it runs on what the mirror captured; warnings fail, as in ci.yml.
        if: steps.mirror.outputs.fetched != '' && steps.mirror.outputs.fetched != '0'
        continue-on-error: true
        run: node "$SEAWORTHY_CLI" verify "$MIRROR_DIR" --fail-on warning --network --format markdown --out "$REPORT_DIR/seaworthy.md"
      - name: Keep one site-down issue open while the check fails
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MIRROR_OUTCOME: ${{ steps.mirror.outcome }}
          SEAWORTHY_OUTCOME: ${{ steps.seaworthy.outcome }}
        with:
          script: |
            const fs = require("node:fs");
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const label = "site-down";
            const mirror = process.env.MIRROR_OUTCOME;
            const seaworthy = process.env.SEAWORTHY_OUTCOME;
            const failed = mirror !== "success" || seaworthy !== "success";

            const read = (name) => {
              try {
                return fs.readFileSync(`${process.env.REPORT_DIR}/${name}`, "utf8").trim();
              } catch {
                return "";
              }
            };
            const clip = (text, limit) => (text.length > limit ? `${text.slice(0, limit)}\n\n…truncated; the full report is in the run log.` : text);

            const parts = [];
            const links = read("links.md");
            const report = read("seaworthy.md");
            if (links) parts.push(`<details><summary>Link check</summary>\n\n${clip(links, 12000)}\n\n</details>`);
            if (report) parts.push(`<details><summary>Seaworthy report</summary>\n\n${clip(report, 24000)}\n\n</details>`);
            if (parts.length === 0) parts.push("No report was written; see the run log.");

            const body = [
              `The nightly check of ${process.env.SITE_URL} ${failed ? "failed" : "passed"}.`,
              "",
              `- Link check (every same-site link and file the deployed site serves): ${mirror}`,
              `- Seaworthy on a mirror of the deployed site: ${seaworthy === "skipped" ? "did not run" : seaworthy}`,
              "",
              ...parts,
              "",
              `Run: ${run}`,
            ].join("\n");

            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, labels: label, state: "open", per_page: 100 });
            const open = issues.filter((issue) => !issue.pull_request);

            if (failed) {
              if (open.length > 0) {
                await github.rest.issues.update({ owner, repo, issue_number: open[0].number, body });
                core.info(`Updated #${open[0].number}`);
              } else {
                try {
                  // Labels are repository settings; create the one this workflow keeps open if it is missing.
                  await github.rest.issues.createLabel({ owner, repo, name: label, color: "b60205", description: "The nightly deployed-site check is failing" });
                } catch (error) {
                  if (error.status !== 422) throw error; // 422: the label already exists
                }
                const created = await github.rest.issues.create({ owner, repo, title: "Deployed site check failed", body, labels: [label] });
                core.info(`Opened #${created.data.number}`);
              }
            } else if (open.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open[0].number, body: `The nightly check of ${process.env.SITE_URL} passed again in [this run](${run}), so it is closing.` });
              await github.rest.issues.update({ owner, repo, issue_number: open[0].number, state: "closed" });
              core.info(`Closed #${open[0].number}`);
            }

            await core.summary.addRaw(`${body}\n`).write();
            if (failed) core.setFailed(`The deployed site check failed; see ${run}`);
