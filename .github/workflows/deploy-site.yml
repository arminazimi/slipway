name: deploy-site

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      # The path Pages serves the repository under: /slipway/ on github.io, or "/" on a custom domain.
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Build spec site content
        run: node tools/spec/build.mjs
      - name: Build site
        # Pages gem needs a repository to avoid metadata errors
        env:
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --source site --destination _site --baseurl "${{ steps.pages.outputs.base_path }}"
          bundle exec jekyll build --source spec/docs-site --destination _site/spec --baseurl "${{ steps.pages.outputs.base_path }}/spec"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
