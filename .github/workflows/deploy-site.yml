name: deploy-site

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Build spec site content
        run: node tools/spec/build.mjs
      - name: Build site
        # Pages gem needs a repository to avoid metadata errors
        env:
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_ENV: production
        run: |

          bundle exec jekyll build --source site --destination _site --baseurl ""
          bundle exec jekyll build --source spec/docs-site --destination _site/spec --baseurl ""
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
