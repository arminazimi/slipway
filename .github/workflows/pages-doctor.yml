name: pages-doctor

# Slipway's own site must reach L3 of the agent-editable spec (spec/agent-editable/0.1.md), so the
# reference site also proves the top level. This builds `site/` the way `deploy-site.yml` does today
# and runs the doctor Action from this repository on the result. #699 adds `tools/pages/build.mjs`
# (theme files from the same commit); `deploy-site.yml` and then this build step switch to it.
on:
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "_layouts/**"
      - "_includes/**"
      - "assets/**"
      - "_data/**"
      - "_config.yml"
      - "action/doctor/**"
      - "packages/doctor/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-doctor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctor:
    name: doctor (L3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # The theme stylesheet fails to build without a UTF-8 locale (ADR 0006).
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Build the site
        # The same command as deploy-site.yml today. #699 moves it to tools/pages/build.mjs.
        env:
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_ENV: production
        run: bundle exec jekyll build --source site --destination _site --baseurl ""
      - uses: ./action/doctor
        with:
          path: site
          build: _site
          level: L3
          setup-node: "false"
