name: ops-update

# When `main` moves, keep agent pull requests mergeable: call the update-branch API
# for open, non-draft pull requests from `agent/*` and `codex/*` branches that are
# behind and have no conflict, and comment once on a conflicting one naming its
# files. The API merges `main` into the branch, so a branch is never force-pushed,
# and a conflicting or up-to-date branch is never touched.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ops-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: update agent pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The update-branch endpoint creates the merge commit on the branch.
      contents: write
      # Updating the branch and commenting on its pull request.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Update behind pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ops/update.mjs
