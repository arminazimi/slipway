name: secrets

# gitleaks on every pull request (the commits it adds), on every push to main, and
# weekly over the whole history, so a leak that slipped through is still found later.
# A finding fails the job; the job summary and the SARIF artifact carry the details.
# Rules and allowlists live in .gitleaks.toml.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, Mondays 03:43 UTC (scheduled runs use this file on main).
    - cron: "43 3 * * 1"

permissions: {}

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Listing the commits of a pull request.
      pull-requests: read
    steps:
      # The full history: a pull request scans the commits it adds, and the weekly
      # run scans every commit. Both actions are pinned to a commit; Dependabot
      # bumps them from the version comments.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_LICENSE: the action asks for one only when the repository
          # owner is an organization; arminazimi is a personal account.
          # Comments need pull-requests: write. The job summary and the SARIF
          # artifact already show the findings, so the token stays read-only.
          GITLEAKS_ENABLE_COMMENTS: "false"
