name: scorecard

# OpenSSF Scorecard scores the repository's supply-chain practices, uploads the report
# to code scanning, and publishes it to api.scorecard.dev so the README badge shows the
# latest score. Publishing needs a public repository: the Scorecard API rejects results
# from private ones. The first run populates the badge; before that it reads "no data".
on:
  # Re-scores when a branch protection rule changes, which keeps Branch-Protection current.
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    # Weekly, Mondays 04:31 UTC (scheduled runs use this file on main).
    - cron: "31 4 * * 1"

# Scorecard only supports the default branch, and publishing results forbids workflow-level
# write permissions. Each job asks for what it needs below.
permissions: {}

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      actions: read # Read the workflow runs Scorecard inspects.
      contents: read
      id-token: write # Sign results published to api.scorecard.dev.
      security-events: write # Upload SARIF to code scanning.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
