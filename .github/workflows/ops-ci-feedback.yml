name: ops-ci-feedback

# A failed `ci` run on an agent's pull request gets one collapsed comment with the
# failing step's last 80 log lines and the command to run locally. This workflow
# runs the default branch's copy with a read token for Actions and a write token
# only for issue comments; it never checks out the pull request.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions: {}

concurrency:
  group: ops-ci-feedback-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  feedback:
    name: comment the failing step
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Comment the failing step
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ops/ci-feedback.mjs
