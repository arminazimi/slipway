name: codeql

# Slipway scans its JavaScript and TypeScript with CodeQL and reports to code scanning.
# CodeQL analyzes a whole repository per language and takes no path filter, so this one job
# covers `packages/` (doctor, mcp, tokens, create-slipway), `tools/`, `action/`, `assets/js/`,
# and the adapters. The theme's Liquid, CSS, and Ruby are out of scope: CodeQL has no
# JavaScript or TypeScript in them. A pull request from a fork gets a read-only token, so its
# results cannot be written to code scanning; branches in this repository upload as usual.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Mondays 05:23 UTC (scheduled runs use this file on main).
    - cron: "23 5 * * 1"

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # CodeQL builds no code for this language, so it needs the sources and nothing else.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          # No compiler to trace: CodeQL reads the sources directly.
          build-mode: none
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
