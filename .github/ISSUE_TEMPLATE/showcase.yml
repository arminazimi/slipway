name: Showcase
description: Share a site built with Slipway
body:
  - type: input
    id: url
    attributes:
      label: Site URL
      description: Link to the live site
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Tell us about what you built
    validations:
      required: true
