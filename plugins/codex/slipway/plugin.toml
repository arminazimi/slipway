[plugin]
name = "slipway"
version = "0.3.0-dev"
description = "Codex plugin for working on Slipway documentation sites, bundling the Site, Content and Doctor skills and the MCP server. 0.3.0 is docs-only: blog, portfolio, and marketing layouts are out of scope."
author = "Slipway"

[[skills]]
path = "../../../skills/slipway-site"

[[skills]]
path = "../../../skills/slipway-content"

[[skills]]
path = "../../../skills/slipway-doctor"

[mcp_servers.slipway]
command = "node"
args = ["../../../packages/mcp/bin/slipway-mcp.ts", "."]
