# yaml-language-server: $schema=../../schema/slipway-config.schema.json
title: Beacon
description: Documentation for the Beacon deploy CLI, in the shape of a real product's site.
lang: en
url: https://example.com
# No baseurl: every example is built for checking with `--baseurl ""` (tools/theme/build.mjs), and
# Seaworthy reads the built folder as the site root, so the site-owned sitemap.xml and llms.txt below
# can only name root URLs. A project-site baseurl would make those two files lie about their own site.
remote_theme: arminazimi/slipway
plugins:
  - jekyll-remote-theme
defaults:
  - scope:
      path: ""
    values:
      layout: doc
