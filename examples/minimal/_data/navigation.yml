# yaml-language-server: $schema=../../../schema/navigation.schema.json
# Navigation, validated by schema/navigation.schema.json. `main` is the header menu and `docs` the
# sidebar of the doc layout (and its previous/next links), in reading order. A language adds
# `main_<lang>` or `docs_<lang>`; one without them uses the plain key.
main:
  - title: Home
    url: /
  - title: Docs
    url: /docs/
  - title: About
    url: /about.html

main_fa:
  - title: خانه
    url: /fa/

main_de:
  - title: Start
    url: /de/

docs:
  - title: Start
    children:
      - title: Introduction
        url: /docs/
      - title: Layouts
        url: /docs/layouts/
  - title: Reference
    children:
      - title: Tokens
        url: /docs/tokens/
