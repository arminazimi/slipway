# yaml-language-server: $schema=../../schema/slipway-config.schema.json
title: Slipway minimal
description: The smallest site that uses every Slipway layout.
lang: en
# The sample posts are dated at the edges of the Jalali year; publish them whatever the clock says.
future: true
theme: slipway-theme
plugins:
  - jekyll-remote-theme

# Theme tokens: change these and the site restyles (see docs/tokens.md). Values shown are the defaults.
slipway:
  persian:
    digits: true
    jalali: true
  languages:
    - { code: en, name: English, prefix: "" }
    - { code: fa, name: فارسی, prefix: /fa }
    - { code: de, name: Deutsch, prefix: /de }
  tokens:
    radius: 0.75rem
    font_body: '"Source Serif 4", Georgia, serif'
    # accent: "#7a4f4f"
    # canvas: "#e9e1d6"
    # font_display: '"Instrument Serif", Georgia, serif'
