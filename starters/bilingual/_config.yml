# yaml-language-server: $schema=../../schema/slipway-config.schema.json
title: Slipway Bilingual
description: A two-language site, English and Persian, left to right and right to left.
lang: en
theme: slipway-theme
plugins:
  - jekyll-remote-theme
slipway:
  languages:
    - { code: en, name: English, prefix: "" }
    - { code: fa, name: فارسی, prefix: /fa }
