<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include theme-init.html %}
  <title>{{ page.title | default: site.title }}</title>
  {%- if page.description %}
  <meta name="description" content="{{ page.description | escape }}">
  {%- endif %}
  <link rel="preload" href="{{ '/assets/fonts/source-serif-4-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/fonts.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/tokens.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/slipway.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/print.css' | relative_url }}" media="print">
  {% include theme-vars.html %}
  <script src="{{ '/assets/js/theme-toggle.js' | relative_url }}" defer></script>
</head>
