{%- assign t = site.slipway.tokens -%}
{%- assign fonts = site.slipway.fonts -%}
{%- if t or fonts == "system" -%}
<style>:root {
{%- if fonts == "system" -%}
  --sl-font-display: var(--sl-font-ui);
  --sl-font-body: var(--sl-font-ui);
  --sl-font-persian: var(--sl-font-arabic);
{%- endif -%}
{%- include theme-var.html name="--sl-color-rose" value=t.accent -%}
{%- include theme-var.html name="--sl-color-rose-fill" value=t.accent -%}
{%- include theme-var.html name="--sl-color-canvas" value=t.canvas -%}
{%- include theme-var.html name="--sl-color-text" value=t.text -%}
{%- include theme-var.html name="--sl-font-display" value=t.font_display -%}
{%- include theme-var.html name="--sl-font-body" value=t.font_body -%}
{%- include theme-var.html name="--sl-radius-card" value=t.radius %} }</style>
{%- endif -%}
