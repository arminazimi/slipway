{%- include component-css.html name="gallery" -%}
<div class="sl-gallery">
  {%- for image in include.images %}
  <figure class="sl-gallery-item">
    <img src="{{ image.src | relative_url | escape }}" alt="{{ image.alt | escape }}"{% if image.srcset %} srcset="{{ image.srcset | escape }}"{% endif %}{% if image.width %} width="{{ image.width }}"{% endif %}{% if image.height %} height="{{ image.height }}"{% endif %}{% if image.lazy %} loading="lazy"{% endif %}>
    {%- if image.caption or image.credit %}
    <figcaption>
      {%- if image.caption %}
      <span class="sl-gallery-caption">{{ image.caption | escape }}</span>
      {%- endif %}
      {%- if image.credit %}
      <span class="sl-gallery-credit">{{ image.credit | escape }}</span>
      {%- endif %}
    </figcaption>
    {%- endif %}
  </figure>
  {%- endfor %}
</div>
